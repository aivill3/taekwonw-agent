# Notion 버튼이 남긴 요청을 주기적으로 확인해 실행한다.
#
# 왜 폴링인가
# ----------
# Notion 버튼의 '웹훅 보내기' 는 유료 플랜 기능이다. 무료 플랜에서 버튼이
# 할 수 있는 것은 속성 값을 바꾸는 것뿐이라, GitHub 를 직접 부르지 못한다.
# 그래서 값을 대신 읽어 실행하는 쪽을 둔다.
#
#   [초안 작성] 클릭 → 상태 = 초안요청
#                        ↓ (이 워크플로가 확인)
#                   run.py publish
#                        ↓
#                   상태 = 작성완료
#
# confirm 은 버튼이 없다. 카드를 칸에 배치한 것 자체가 의사표시라
# 매번 검사만 하면 된다. 규칙을 어긴 칸은 상태를 바꾸지 않고 카드에
# '⚠️ 승인 불가' 만 남긴다.
#
# 실행 주기와 Actions 분
# --------------------
# 비공개 저장소의 무료 한도는 월 2,000분이고, 작업 하나가 1초를 써도
# 1분으로 올림해 과금된다. 24시간 30분 간격이면 48회/일 × 30일 = 1,440분
# 이라 한도에 바짝 붙는다. 초안 작성이 실제로 도는 날은 편당 몇 분이
# 더 붙어 넘어간다.
#
# 그래서 평일 업무 시간으로 좁혔다. 20회/일 × 22일 = 440분 남짓이라
# 실제 작업분을 더해도 여유가 있다.
#
#   할 일이 없을 때  ~25초 → 1분 과금
#   초안 4편 작성    ~5분
#
# 버튼을 누르고 최대 30분을 기다린다. 즉시성이 필요하면 Actions 탭에서
# publish 워크플로를 직접 실행하면 된다.
name: poll

on:
  schedule:
    # UTC 기준. 00:00~09:00 UTC = 09:00~18:00 KST, 평일만.
    - cron: "*/15 0-9 * * 1-5"
  workflow_dispatch:          # 기다리지 않고 지금 확인

concurrency:
  group: taekwonw-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_CONTENT_DATABASE_ID: ${{ secrets.NOTION_CONTENT_DATABASE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      IMAGE_SOURCE: hybrid
      KEEP_WRITTEN: "true"
      WRITTEN_RETENTION_DAYS: "30"

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 의존성 설치
        run: uv sync --frozen

      - name: 배치 확정
        # '초안요청' 중 아직 묶음ID 가 없는 것을 검증해 확정한다.
        # 규칙을 어긴 칸은 '선정됨' 으로 되돌리고 카드에 사유를 남긴다.
        run: uv run python run.py confirm

      - name: 초안 작성
        # 묶음ID 가 붙은 '초안요청' 만 처리한다. 없으면 조용히 끝난다.
        # confirm 이 실패해도 여기는 돌린다 — 앞 단계와 독립적인 요청이다.
        if: always()
        run: uv run python run.py publish

      - name: 상태 저장
        if: always()
        run: |
          git config user.name "taekwonw-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "state: poll $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

      - name: 로그 보관
        # 할 일이 없던 실행까지 아티팩트를 남기면 목록이 지저분해진다.
        # 실패했을 때만 남긴다.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-poll-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore