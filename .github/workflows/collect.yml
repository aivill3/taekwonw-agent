# 하루 두 번 수집 → 묶음 배정.
#
# 사람 개입이 없는 두 단계만 돌린다. 확정과 초안 작성은 보드에서 배치를
# 확인한 뒤 [초안 작성] 버튼을 눌러야 시작된다(poll.yml).
#
# 하루 두 번인 이유
# ---------------
# 오전에 한 번만 돌리면 낮에 나온 기사가 다음 날까지 밀린다. 태권도
# 대회 소식은 당일 오후에 올라오는 것이 많아 시의성이 떨어진다.
#
# 오후 회차는 오전에 배정하고 남은 슬롯만 쓴다. content 가 이미 점유된
# 칸을 건너뛰므로(occupied 검사) 오전 배정분을 덮어쓰지 않는다.
#
# cron 은 정시를 보장하지 않는다. GitHub 부하에 따라 5~15분, 때로는 더
# 늦게 시작한다. collect 는 몇 분 늦어도 문제가 없어 그대로 둔다.
name: collect

on:
  schedule:
    # UTC 기준. KST = UTC + 9. 평일(KST 월~금)만 돈다.
    #
    # 두 줄의 요일 범위가 다른 것은 오타가 아니다.
    # 08:00 KST 는 전날 23:00 UTC 라 요일이 하루 밀린다.
    #
    #   UTC 일 23:00 → KST 월 08:00
    #   UTC 목 23:00 → KST 금 08:00
    #   UTC 금 23:00 → KST 토 08:00   ← 이것을 빼야 한다
    #
    # 두 줄을 같은 "1-5" 로 맞추면 KST 토요일 아침에 돌고 월요일
    # 아침이 빠진다. 2026-09-06(토)에 실제로 그렇게 돌았다.
    - cron: "0 23 * * 0-4"    # 23:00 UTC 일~목 = 08:00 KST 월~금
    - cron: "0 2 * * 1-5"     # 02:00 UTC 월~금 = 11:00 KST 월~금
  workflow_dispatch:          # 수동 실행 버튼

# state/ 를 커밋하므로 두 워크플로가 겹치면 push 가 충돌한다.
# publish.yml 과 같은 group 을 써서 직렬화한다.
concurrency:
  group: taekwonw-pipeline
  cancel-in-progress: false

permissions:
  contents: write             # state/ 커밋에 필요

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_CONTENT_DATABASE_ID: ${{ secrets.NOTION_CONTENT_DATABASE_ID }}
      # 보드 페이지 ID. '승인 불가 현황' 콜아웃이 이 페이지에 있다.
      # 비어 있으면 reset_notice / write_notice 가 조용히 건너뛴다.
      NOTION_BOARD_PAGE_ID: ${{ secrets.NOTION_BOARD_PAGE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # 동작 설정. 숨길 값이 아니라 시크릿이 아니라 여기에 둔다.
      # 워크플로 파일만 봐도 어떤 조건으로 도는지 알 수 있어야 한다.
      IMAGE_SOURCE: hybrid
      # 작성완료 페이지를 Notion 에서 지우지 않는다.
      # 러너의 파일 시스템은 실행이 끝나면 사라지므로, 로컬에 남는
      # data/drafts 를 백업으로 칠 수 없다. Notion 이 유일한 사본이다.
      KEEP_WRITTEN: "true"
      WRITTEN_RETENTION_DAYS: "30"

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 의존성 설치
        run: uv sync --frozen

      - name: 수집
        run: uv run python run.py collect

      - name: 묶음 배정
        run: uv run python run.py content

      - name: 상태 저장
        # 모델 소진 기록이 바뀌었을 수 있다. 안 남기면 다음 실행이
        # 한도가 끝난 모델에 다시 요청을 던진다.
        if: always()
        run: |
          git config user.name "taekwonw-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "state: collect $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          # 다른 워크플로가 먼저 밀어 넣었을 수 있다
          git pull --rebase --autostash
          git push

      - name: 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-collect-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore