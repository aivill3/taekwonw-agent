# 수동 실행용 워크플로.
#
#   action=images               이미 나온 초안에 삽화만 채우기
#
# 초안 작성은 collect.yml 이 자동으로 한다 (2026-09 구조 변경).
# confirm / publish 는 옛 뉴스 DB 보드 경로라 여기서 뺐다.
#
# 지연: 큐 대기와 러너 부팅에 10~40초, uv sync 와 CLIP 로딩이 더 붙는다.
name: publish

on:
  workflow_dispatch:
    inputs:
      action:
        description: "실행할 단계"
        required: true
        default: images
        type: choice
        options: [images]

concurrency:
  group: taekwonw-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # 삽화까지 붙으면 편당 수 분이 걸린다

    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_CONTENT_DATABASE_ID: ${{ secrets.NOTION_CONTENT_DATABASE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # 동작 설정. 숨길 값이 아니라 시크릿이 아니라 여기에 둔다.
      # GPU 서버는 러너에서 닿지 않으므로 스톡으로만 채워진다.
      IMAGE_SOURCE: hybrid

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 의존성 설치
        run: uv sync --frozen

      - name: 실행
        run: |
          case "${{ inputs.action }}" in
            images)        uv run python run.py images ;;
            *) echo "알 수 없는 action: ${{ inputs.action }}"; exit 1 ;;
          esac

      - name: 상태 저장
        # 스톡 재사용 이력과 모델 소진 기록. 안 남기면 다음 실행에서
        # 같은 사진이 다시 나오고 소진된 모델을 또 두드린다.
        if: always()
        run: |
          git config user.name "taekwonw-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "state: ${{ inputs.action }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

      - name: 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.action }}-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore